<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Race 3D – Car Selection</title>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/"
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #05060a;
      --bg2: #071029;
      --panel: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8eef6;
      --muted: rgba(232, 238, 246, 0.68);
      --pink: #ff2d95;
      --cyan: #00e6d9;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Rajdhani, system-ui, sans-serif;
      color: var(--text);
      overflow: auto;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(255, 45, 149, 0.08) 0%, transparent 14%),
        radial-gradient(ellipse at 80% 90%, rgba(0, 230, 217, 0.06) 0%, transparent 16%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.08;
    }

    .split {
      position: relative;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      height: calc(var(--vh, 1vh) * 100);
      transition: grid-template-columns 0.5s ease;
    }

    .split--multi {
      grid-template-columns: 35fr 15fr 15fr 35fr;
    }

    .panel {
      position: relative;
      padding: 4.5rem 1.5rem 1.5rem 1.5rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.32));
      pointer-events: none;
    }

    .panel.left { border-right: 1px solid rgba(255, 255, 255, 0.05); }
    .panel.right { border-left: 1px solid rgba(255, 255, 255, 0.04); }

    .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      font-size: 0.76rem;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    h1, h2 {
      margin: 0;
      font-family: Orbitron, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      color: var(--pink);
      text-shadow: 0 0 12px rgba(255, 45, 149, 0.2), 0 10px 28px rgba(0, 0, 0, 0.6);
    }

    h2 {
      font-size: 1.1rem;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 230, 217, 0.18), 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
      margin: 0;
      max-width: 58ch;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }

    .controls-hint {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
      margin: 0;
    }

    .controls-hint .hint-group {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .controls-hint .hint-sep {
      color: rgba(255,255,255,0.2);
      font-size: 0.8rem;
      padding: 0 0.15rem;
    }

    .controls-hint .hint-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6rem;
      height: 1.6rem;
      padding: 0 0.4rem;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.18);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(4px);
      font-family: Orbitron, monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
      white-space: nowrap;
    }

    .panel.left  kbd { border-color: rgba(255,45,149,0.35); color: var(--pink); box-shadow: 0 2px 8px rgba(255,45,149,0.15), inset 0 1px 0 rgba(255,255,255,0.1); }
    .panel.right kbd { border-color: rgba(0,230,217,0.35); color: var(--cyan); box-shadow: 0 2px 8px rgba(0,230,217,0.12), inset 0 1px 0 rgba(255,255,255,0.1); }

    @media (max-height: 520px) {
      .controls-hint { gap: 0.3rem; }
      kbd { min-width: 1.3rem; height: 1.3rem; font-size: 0.55rem; padding: 0 0.3rem; }
      .controls-hint .hint-label { font-size: 0.62rem; }
    }

    @media (max-width: 720px) {
      .controls-hint { gap: 0.35rem; }
      kbd { min-width: 1.4rem; height: 1.4rem; font-size: 0.58rem; }
    }

    .viewer {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 15px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .webgl-output {
      position: absolute;
      inset: 0;
    }

    .car-chip {
      position: absolute;
      left: 50%;
      bottom: 4rem;
      transform: translateX(-50%);
      z-index: 3;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      font-family: Orbitron, sans-serif;
      letter-spacing: 0.06em;
      color: var(--cyan);
      white-space: nowrap;
    }

    .viewer-actions {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 0.5rem;
    }

    .select-btn {
      border: 1px solid rgba(0, 230, 217, 0.4);
      background: linear-gradient(180deg, rgba(0, 230, 217, 0.3), rgba(0, 190, 185, 0.15));
      color: #fff;
      font-family: Orbitron, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 230, 217, 0.2);
      transition: all 0.2s ease;
    }

    .select-btn:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
    }

    .back-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 50;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #9ab4d9;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      font-family: Orbitron, sans-serif;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateX(-3px);
    }
    
    .select-btn.selected {
        background: var(--pink);
        border-color: var(--pink);
        box-shadow: 0 0 15px var(--pink);
    }

    .stats {
      display: grid;
      gap: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .stat-card {
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: baseline;
      margin-bottom: 0.35rem;
    }

    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
      color: rgba(232, 238, 246, 0.6);
    }

    .stat-value {
      font-family: Orbitron, sans-serif;
      font-size: 0.8rem;
      color: var(--text);
    }

    .bar {
      height: 0.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      box-shadow: 0 0 8px rgba(0, 230, 217, 0.2);
    }

    /* Multiplayer Split Styling */
    .p2-mirror {
        transform: scaleX(-1);
    }
    .p2-mirror .car-chip, .p2-mirror .viewer-actions, .p2-mirror h1, .p2-mirror h2, .p2-mirror p {
        transform: scaleX(-1);
    }
    .p2-mirror .car-chip { left: auto; right: 50%; transform: translateX(50%) scaleX(-1); }
    .p2-mirror .viewer-actions { left: auto; right: 50%; transform: translateX(50%) scaleX(-1); }
    .p2-mirror .controls-hint { transform: scaleX(-1); }

    .split--multi .panel {
        padding: 4.5rem 1rem 1rem 1rem;
    }
    .split--multi h1, .split--multi h2 { font-size: 0.9rem; }
    .split--multi .subtitle { font-size: 0.75rem; }
    .split--multi .car-chip { font-size: 0.7rem; bottom: 3rem; }
    .split--multi .stat-card { padding: 0.45rem 0.65rem; border-radius: 10px; }
    .split--multi .stat-value { font-size: 0.75rem; }
    .split--multi .bar { height: 0.4rem; }
    
    .ready-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }
    .ready-overlay.active { opacity: 1; pointer-events: all; }
    .ready-overlay h2 { font-size: 3rem; margin-bottom: 2rem; color: var(--cyan); }

    @media (max-width: 1200px) {
      .split--multi { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: auto; overflow: auto; }
        .split--multi .panel { height: 50vh; }
    }
    @media (max-width: 720px) and (orientation: portrait) {
        .split {
        grid-template-columns: 1fr !important;
        grid-template-rows: 1.15fr 0.85fr !important;
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
        }
        .split--multi {
            grid-template-columns: 1fr !important;
            grid-template-rows: repeat(4, 50vh) !important;
            height: 200vh;
            overflow-y: auto;
        }
        #p1-viewer-panel { order: 1; }
        #p1-stats-panel { order: 2; }
        #p2-viewer-panel { order: 3; }
        #p2-stats-panel { order: 4; }
    }
    @media (max-width: 720px) {
        .panel, .split--multi .panel {
            padding: 3.5rem 1rem 1rem 1rem;
            gap: 0.6rem;
        }
        .eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
        }
        h1 {
            font-size: 1.3rem;
        }
        h2 {
            font-size: 1.1rem;
        }
        .subtitle {
            font-size: 0.8rem;
            line-height: 1.35;
        }
        .viewer {
            border-radius: 12px;
        }
        .car-chip {
            bottom: 3.2rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }
        .select-btn {
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
        }
        .stats {
            gap: 0.4rem;
        }
        .stat-card {
            padding: 0.5rem 0.7rem;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 0.65rem;
        }
        .stat-value {
            font-size: 0.75rem;
        }
        .bar {
            height: 0.4rem;
        }
        .ready-overlay h2 {
            font-size: 2.2rem;
        }
    }
    @media (max-height: 520px) {

      .back-btn {
        top: 0.6rem;
        left: 0.6rem;
        font-size: 0.8rem;
        padding: 0.35rem 0.85rem;
      }

        .panel, .split--multi .panel {
            padding: 3.2rem 0.75rem 0.75rem 0.75rem;
            gap: 0.5rem;
        }
        .eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
        }
        h1 {
            font-size: 1.2rem;
        }
        h2 {
            font-size: 1.0rem;
        }
        .subtitle {
            font-size: 0.75rem;
            line-height: 1.3;
        }
        .car-chip {
            bottom: 2.8rem;
            padding: 0.2rem 0.4rem;
            font-size: 0.7rem;
        }
        .select-btn {
            padding: 0.35rem 0.85rem;
            font-size: 0.7rem;
        }
        .stats {
            gap: 0.3rem;
        }
        .stat-card {
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
        }
        .stat-label {
            font-size: 0.6rem;
        }
        .stat-value {
            font-size: 0.7rem;
        }
        .bar {
            height: 0.35rem;
        }
    }
    @media screen and (max-device-width: 920px) and (orientation: portrait) {
        body::after {
            content: "↺\A Please rotate your device to landscape mode";
            white-space: pre-wrap;
            position: fixed;
            inset: 0;
            background: #05060b;
            color: #ffffff;
            opacity: 1;
            pointer-events: auto;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 0 0 30px rgba(0, 230, 217, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 2rem;
            z-index: 999999;
            line-height: 2;
        }
    }
  </style>
</head>
<body>
  <button id="back-btn" class="back-btn" type="button">← Back</button>
  <div id="main-container" class="split">
    <!-- Player 1 Car View -->
    <section class="panel left" id="p1-viewer-panel">
      <p class="eyebrow">Player 1</p>
      <h1>Choose your car</h1>
      <div class="controls-hint">
        <div class="hint-group">
          <kbd>A</kbd><kbd>D</kbd>
          <span class="hint-label">Navigate</span>
        </div>
        <span class="hint-sep">·</span>
        <div class="hint-group">
          <kbd>S</kbd>
          <span class="hint-label">Select</span>
        </div>
      </div>

      <div class="viewer">
        <div id="p1-webgl" class="webgl-output"></div>
        <div class="car-chip" id="p1-car-name">car1</div>
        <div class="viewer-actions">
          <button class="select-btn" id="p1-select" type="button">Select Car</button>
        </div>
      </div>
    </section>

    <!-- Player 1 Stats (or Single Player Stats) -->
    <section class="panel right" id="p1-stats-panel">
      <p class="eyebrow">Stats</p>
      <h2 id="p1-stats-title">car1</h2>
      <p class="subtitle" id="p1-stats-text"></p>
      <div class="stats" id="p1-stats"></div>
    </section>

    <!-- Player 2 Stats (Hidden in Solo) -->
    <section class="panel left hidden-solo" id="p2-stats-panel" style="display:none">
      <p class="eyebrow">Stats</p>
      <h2 id="p2-stats-title">car1</h2>
      <p class="subtitle" id="p2-stats-text"></p>
      <div class="stats" id="p2-stats"></div>
    </section>

    <!-- Player 2 Car View (Hidden in Solo) -->
    <section class="panel right hidden-solo p2-mirror" id="p2-viewer-panel" style="display:none">
      <p class="eyebrow">Player 2</p>
      <h1>Choose your car</h1>
      <div class="controls-hint">
        <div class="hint-group">
          <kbd>←</kbd><kbd>→</kbd>
          <span class="hint-label">Navigate</span>
        </div>
        <span class="hint-sep">·</span>
        <div class="hint-group">
          <kbd>↵</kbd>
          <span class="hint-label">Select / Cancel</span>
        </div>
      </div>

      <div class="viewer">
        <div id="p2-webgl" class="webgl-output"></div>
        <div class="car-chip" id="p2-car-name">car1</div>
        <div class="viewer-actions">
          <button class="select-btn" id="p2-select" type="button">Select Car</button>
        </div>
      </div>
    </section>
  </div>

  <div id="ready-overlay" class="ready-overlay">
      <h2>GET READY</h2>
      <p>Starting race...</p>
  </div>

  <script src="cars.js"></script>
  <script src="assets.js"></script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    window.GLTFLoader = GLTFLoader;

    // Start loading models in the background
    window.AssetManager.loadAll();

    const urlParams = new URLSearchParams(window.location.search);
    const isMulti = urlParams.get('mode') === 'multi';
    const carList = window.CarCatalog.getCarList();
    
    const players = {
        p1: { index: 0, selected: false, name: carList[0], scene: null, camera: null, renderer: null, carGroup: null },
        p2: { index: 0, selected: false, name: carList[0], scene: null, camera: null, renderer: null, carGroup: null }
    };

    let isMobileMultiplayer = isMulti && window.matchMedia('(max-height: 520px)').matches;

    if (isMulti) {
        if (!isMobileMultiplayer) {
            document.getElementById('main-container').classList.add('split--multi');
        }
        document.querySelectorAll('.hidden-solo').forEach(el => el.style.display = 'flex');
        document.getElementById('p1-viewer-panel').querySelector('h1').textContent = "P1: Select";
        document.getElementById('p2-viewer-panel').querySelector('h1').textContent = "P2: Select";
        
        if (isMobileMultiplayer) {
            document.getElementById('p2-viewer-panel').style.display = 'none';
            document.getElementById('p2-stats-panel').style.display = 'none';
        }
    }

    function initPlayer(pId, containerId) {
        const container = document.getElementById(containerId);
        const p = players[pId];
        
        p.scene = new THREE.Scene();
        p.scene.background = new THREE.Color(0x050810);
        p.scene.fog = new THREE.Fog(0x050810, 14, 40);

        p.camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
        p.camera.position.set(0, 2.8, 8);
        p.camera.lookAt(0, 0.9, 0);

        p.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        p.renderer.setPixelRatio(window.devicePixelRatio);
        p.renderer.setSize(container.clientWidth, container.clientHeight);
        p.renderer.shadowMap.enabled = true;
        container.appendChild(p.renderer.domElement);

        p.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 1.1);
        key.position.set(5, 9, 6);
        key.castShadow = true;
        key.shadow.mapSize.width = 1024;
        key.shadow.mapSize.height = 1024;
        key.shadow.camera.near = 0.5;
        key.shadow.camera.far = 25;
        const d = 6;
        key.shadow.camera.left = -d;
        key.shadow.camera.right = d;
        key.shadow.camera.top = d;
        key.shadow.camera.bottom = -d;
        key.shadow.bias = -0.001;
        p.scene.add(key);

        const fill = new THREE.DirectionalLight(0x00e6d9, 0.45);
        fill.position.set(-6, 2, -4);
        p.scene.add(fill);

        p.scene.add(createPlatform());
        updateCarUI(pId);
    }

    function createPlatform() {
      const platform = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(4.2, 4.4, 0.35, 64),
        new THREE.MeshStandardMaterial({ color: 0x06070b, roughness: 0.95, metalness: 0.1 })
      );
      base.position.y = -0.18;
      base.receiveShadow = true;
      platform.add(base);

      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(4.0, 4.0, 0.08, 64),
        new THREE.MeshStandardMaterial({ color: 0x0c1221, roughness: 0.7, metalness: 0.15, emissive: 0x08182a, emissiveIntensity: 0.3 })
      );
      top.position.y = 0.02;
      top.receiveShadow = true;
      platform.add(top);

      return platform;
    }

    function updateCarUI(pId) {
        const p = players[pId];
        const carName = carList[p.index];
        p.name = carName;
        const spec = window.CarCatalog.getCarSpec(carName);
        
        document.getElementById(`${pId}-car-name`).textContent = carName.toUpperCase();
        document.getElementById(`${pId}-stats-title`).textContent = carName.toUpperCase();
        
        const metrics = window.CarCatalog.getMetrics(spec);
        const statsEl = document.getElementById(`${pId}-stats`);
        const statsData = [
            ['Acceleration', (metrics.acceleration / 0.09) * 10],
            ['Top Speed', (metrics.speed / 450) * 10],
            ['Braking', (metrics.braking / 0.35) * 10],
            ['Grip', (metrics.grip / 5) * 10]
        ];

        statsEl.innerHTML = statsData.map(([label, val]) => `
            <div class="stat-card">
              <div class="stat-top">
                <span class="stat-label">${label}</span>
                <span class="stat-value">${Math.min(10, val).toFixed(1)} / 10</span>
              </div>
              <div class="bar"><span style="width:${Math.min(100, val * 10)}%;"></span></div>
            </div>
        `).join('');

        document.getElementById(`${pId}-stats-text`).textContent = `${spec.vehicle.mass} kg · ${spec.engine.rpmMax} RPM`;

        // Load 3D model
        if (p.carGroup) p.scene.remove(p.carGroup);
        const mesh = window.CarCatalog.createCarMesh(THREE, carName, spec, {
            mode: 'preview',
            onModelLoaded: () => {
                if (p.name === carName) updateCarUI(pId);
            }
        });
        if (mesh) {
            mesh.scale.multiplyScalar(2.2);
            p.scene.add(mesh);
            p.carGroup = mesh;
        }
    }

    function handleSelection(pId) {
        const p = players[pId];
        p.selected = !p.selected;
        const btn = document.getElementById(`${pId}-select`);
        
        if (p.selected) {
            btn.textContent = "READY";
            btn.classList.add('selected');
            
            // On mobile, progress sequentially from P1 to P2
            if (isMobileMultiplayer && pId === 'p1') {
                document.getElementById('p1-viewer-panel').style.display = 'none';
                document.getElementById('p1-stats-panel').style.display = 'none';
                
                document.getElementById('p2-viewer-panel').style.display = 'flex';
                document.getElementById('p2-stats-panel').style.display = 'flex';
                
                // Trigger a resize to ensure P2's WebGL canvas scales properly
                setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
            }
        } else {
            btn.textContent = "Select Car";
            btn.classList.remove('selected');
        }
        checkStart();
    }

    function checkStart() {
        const p1Ready = players.p1.selected;
        const p2Ready = isMulti ? players.p2.selected : true;
        
        if (p1Ready && p2Ready) {
            document.getElementById('ready-overlay').classList.add('active');
            setTimeout(() => {
                const params = new URLSearchParams();
                if (isMulti) params.set('mode', 'multi');
                params.set('p1', players.p1.name);
                if (isMulti) params.set('p2', players.p2.name);
                window.location.href = `game.html?${params.toString()}`;
            }, 1500);
        }
    }

    initPlayer('p1', 'p1-webgl');
    if (isMulti) initPlayer('p2', 'p2-webgl');

    // Swipe navigation for mobile
    function setupSwipe(panelId, pId) {
        const panel = document.getElementById(panelId);
        if (!panel) return;

        let startX = 0;
        let startY = 0;

        panel.addEventListener('touchstart', (e) => {
            if (players[pId].selected) return;
            if (e.target.closest && (e.target.closest('.select-btn') || e.target.closest('button'))) {
                return;
            }
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        panel.addEventListener('touchend', (e) => {
            if (players[pId].selected) return;
            if (e.target.closest && (e.target.closest('.select-btn') || e.target.closest('button'))) {
                return;
            }

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = endX - startX;
            const diffY = endY - startY;

            if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < 0) {
                    players[pId].index = (players[pId].index + 1) % carList.length;
                    updateCarUI(pId);
                } else {
                    players[pId].index = (players[pId].index - 1 + carList.length) % carList.length;
                    updateCarUI(pId);
                }
            }
        }, { passive: true });
    }

    setupSwipe('p1-viewer-panel', 'p1');
    setupSwipe('p1-stats-panel', 'p1');
    if (isMulti) {
        setupSwipe('p2-viewer-panel', 'p2');
        setupSwipe('p2-stats-panel', 'p2');
    }

    window.addEventListener('keydown', (e) => {
        // P1 Controls: A/D
        if (!players.p1.selected) {
            if (e.key.toLowerCase() === 'a') {
                players.p1.index = (players.p1.index - 1 + carList.length) % carList.length;
                updateCarUI('p1');
            } else if (e.key.toLowerCase() === 'd') {
                players.p1.index = (players.p1.index + 1) % carList.length;
                updateCarUI('p1');
            }
        }
        if (e.key.toLowerCase() === 's' || e.key === ' ') {
            handleSelection('p1');
        }

        // P2 Controls: Arrows
        if (isMulti) {
            if (!players.p2.selected) {
                if (e.key === 'ArrowLeft') {
                    players.p2.index = (players.p2.index - 1 + carList.length) % carList.length;
                    updateCarUI('p2');
                } else if (e.key === 'ArrowRight') {
                    players.p2.index = (players.p2.index + 1) % carList.length;
                    updateCarUI('p2');
                }
            }
            if (e.key === 'ArrowDown' || e.key === 'Enter') {
                handleSelection('p2');
            }
        }
    });

    document.getElementById('p1-select').addEventListener('click', () => handleSelection('p1'));
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '../index.html';
    });
    if (isMulti) document.getElementById('p2-select').addEventListener('click', () => handleSelection('p2'));

    function animate() {
        requestAnimationFrame(animate);
        Object.values(players).forEach(p => {
            if (p.renderer && p.scene && p.camera) {
                if (p.carGroup) p.carGroup.rotation.y += 0.005;
                p.renderer.render(p.scene, p.camera);
            }
        });
    }
    animate();

    window.addEventListener('resize', () => {
        Object.values(players).forEach(p => {
            if (p.renderer && p.camera) {
                const container = p.renderer.domElement.parentElement;
                p.camera.aspect = container.clientWidth / container.clientHeight;
                p.camera.updateProjectionMatrix();
                p.renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    });

  </script>
  <script>
    (function(){
      function setVh(){
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
        document.body.style.minHeight = 'calc(var(--vh, 1vh) * 100 + 1px)';
        document.documentElement.style.overflow = 'auto';
        document.body.style.overflow = 'auto';
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
    })();
  </script>
</body>
