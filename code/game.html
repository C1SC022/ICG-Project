<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag Race 3D – Game</title>
<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
	{
		"imports": {
			"three": "https://threejs.org/build/three.module.js",
			"three/addons/": "https://threejs.org/examples/jsm/"
		}
	}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard dashboard--p1">
	<div class="meter meter--rpm meter--p1 meter--big-label"></div>
	<div class="meter meter--gear meter--p1"><div>N</div></div>
</div>

<div class="dashboard dashboard--p2 hidden-solo" style="display:none">
	<div class="meter meter--gear meter--p2"><div>N</div></div>
	<div class="meter meter--rpm meter--p2 meter--big-label"></div>
</div>

<div id="raceCountdown" class="race-overlay race-overlay--countdown hidden">5</div>
<div id="raceFinish" class="race-overlay race-overlay--finish hidden">
	<div class="race-overlay__title">Finish</div>
	<div id="raceWinner" class="race-overlay__winner">PLAYER 1 WINS</div>
	<div id="raceFinishTime" class="race-overlay__time">0.00s</div>
</div>

<div class="race-controls">
	<button id="restartRaceBtn" class="race-btn" type="button">Restart</button>
	<button id="menuRaceBtn" class="race-btn race-btn--secondary" type="button">Menu</button>
</div>

<div id="loadingOverlay" style="position:fixed;inset:0;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#00e6d9;font-family:Orbitron,sans-serif;transition:opacity 0.5s;">
	<h2 style="margin-bottom:20px;text-shadow:0 0 12px rgba(0,230,217,0.4);">LOADING ENVIRONMENT...</h2>
	<div style="width:300px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
		<div id="loadingProgress" style="width:0%;height:100%;background:var(--neon-cyan, #00e6d9);transition:width 0.2s;box-shadow:0 0 10px #00e6d9;"></div>
	</div>
</div>


<script src="cars.js"></script>
<script src="assets.js"></script>
<script type="module">
	import * as THREE from 'three';
	import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
	import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
	import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
	import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
	window.THREE = THREE;
	window.GLTFLoader = GLTFLoader;
	window.ColladaLoader = ColladaLoader;
	window.OBJLoader = OBJLoader;
	window.MTLLoader = MTLLoader;

	const urlParams = new URLSearchParams(window.location.search);
	const isMulti = urlParams.get('mode') === 'multi';
	
	if (isMulti) {
		document.querySelector('.dashboard--p1').classList.add('dashboard--split-left');
		document.querySelector('.dashboard--p2').style.display = 'flex';
		document.querySelector('.dashboard--p2').classList.add('dashboard--split-right');
	}

	// In game mode, we need to ensure everything is loaded before starting
	const loadingProgress = document.getElementById('loadingProgress');
	const loadingOverlay = document.getElementById('loadingOverlay');

	window.AssetManager.loadAll(
		function(progress) {
			if (loadingProgress) loadingProgress.style.width = (progress * 100) + '%';
		},
		function() {
			if (loadingOverlay) {
				loadingOverlay.style.opacity = '0';
				setTimeout(() => loadingOverlay.style.display = 'none', 500);
			}
			const gameScript = document.createElement('script');
			gameScript.src = isMulti ? 'multiplayer.js' : 'game.js';
			document.body.appendChild(gameScript);
		}
	);
</script>
</body>
</html>
