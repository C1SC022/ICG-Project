<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Race 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --pink: #ff2d95;
      --cyan: #00e6d9;
      --pink-glow: rgba(255,45,149,0.18);
      --cyan-glow: rgba(0,230,217,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      color: #e6eef6;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ── Ambient background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 25% 50%, rgba(255,40,150,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 75% 50%, rgba(0,230,217,0.07) 0%, transparent 70%),
        linear-gradient(180deg, #07080f 0%, #05060a 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Title bar ── */
    .title-bar {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2.2rem 1rem 1rem;
      flex-shrink: 0;
    }

    .title-bar h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.6rem, 5vw, 3rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--pink) 0%, #fff 45%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(0,230,217,0.2));
    }

    .title-bar .subtitle {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-top: 0.3rem;
    }

    /* ── Divider line ── */
    .divider {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      flex-shrink: 0;
    }

    /* ── Split panels ── */
    .split-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Center divider */
    .split-container::before {
      content: '';
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.07), transparent);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 3rem;
      gap: 1.2rem;
      cursor: pointer;
      transition: background 0.3s;
      position: relative;
      text-decoration: none;
      color: inherit;
    }

    .panel.left:hover  { background: radial-gradient(ellipse 80% 60% at 40% 50%, rgba(255,45,149,0.06), transparent); }
    .panel.right:hover { background: radial-gradient(ellipse 80% 60% at 60% 50%, rgba(0,230,217,0.05), transparent); }


    /* Heading */
    .panel h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .panel.left  h2 { color: var(--pink); text-shadow: 0 0 20px var(--pink-glow); }
    .panel.right h2 { color: var(--cyan); text-shadow: 0 0 20px var(--cyan-glow); }

    /* Description */
    .panel p {
      max-width: 28ch;
      text-align: center;
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(200,215,235,0.7);
    }

    /* CTA button */
    .btn-start {
      margin-top: 0.5rem;
      padding: 0.8rem 2.2rem;
      border-radius: 8px;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-start.left {
      background: linear-gradient(135deg, #1a0516, #0f000a);
      color: var(--pink);
      border: 1px solid rgba(255,45,149,0.2);
      box-shadow: 0 4px 20px rgba(255,45,149,0.1);
    }
    .btn-start.right {
      background: linear-gradient(135deg, #001514, #000f0e);
      color: var(--cyan);
      border: 1px solid rgba(0,230,217,0.18);
      box-shadow: 0 4px 20px rgba(0,230,217,0.08);
    }
    .panel.left:hover  .btn-start { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,45,149,0.22); }
    .panel.right:hover .btn-start { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,230,217,0.18); }
    .btn-start:active { transform: translateY(1px) !important; }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .btn-rules {
      padding: 0.6rem 1.8rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: rgba(180,200,220,0.6);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn-rules:hover {
      color: var(--cyan);
      border-color: rgba(0,230,217,0.3);
      box-shadow: 0 0 16px rgba(0,230,217,0.15);
    }

    /* ── Mobile portrait warning ── */
    @media screen and (max-device-width: 920px) and (orientation: portrait) {
      body::after {
        content: "↺\A Please rotate your device";
        white-space: pre-wrap;
        position: fixed;
        inset: 0;
        background: #05060b;
        color: #ffffff;
        opacity: 1;
        pointer-events: auto;
        text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 30px rgba(0,230,217,0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.4rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
        padding: 2rem;
        z-index: 999999;
        line-height: 2;
      }
    }

    /* ── Compact mobile landscape ── */
    @media (max-height: 500px) {
      .title-bar { padding: 1rem 1rem 0.5rem; }
      .title-bar h1 { font-size: 1.3rem; }
      .title-bar .subtitle { display: none; }
      .panel { padding: 1rem 1.5rem; gap: 0.6rem; }
      .panel p { font-size: 0.85rem; }
      .bottom-bar { padding: 0.6rem; }
    }
  </style>
</head>
<body>

  <div class="title-bar">
    <h1>Drag Race 3D</h1>
    <div class="subtitle">Quarter Mile · Street Racing</div>
  </div>
  <div class="divider"></div>

  <div class="split-container">
    <section class="panel left" aria-label="Solo training" onclick="location.href='code/CarSelection.html'">
      <h2>Solo</h2>
      <p>Training mode — practice launches and perfect your shifts.</p>
      <button class="btn-start left" id="start-solo">Start Solo</button>
    </section>

    <section class="panel right" aria-label="Race 1v1" onclick="location.href='code/CarSelection.html?mode=multi'">
      <h2>Race</h2>
      <p>1v1 split-screen — compete against a friend in real time.</p>
      <button class="btn-start right" id="start-race">Start Race</button>
    </section>
  </div>

  <div class="bottom-bar">
    <button onclick="location.href='code/rules.html'" class="btn-rules">Rules &amp; Guide</button>
  </div>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/"
      }
    }
  </script>
  <script src="code/assets.js"></script>
  <script type="module">
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    window.GLTFLoader = GLTFLoader;
    if (window.AssetManager) window.AssetManager.loadAll();
  </script>
</body>
</html>
